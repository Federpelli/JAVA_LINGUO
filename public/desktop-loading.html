<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAVA_linguo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; overscroll-behavior-x: none; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f2f7e9; background: radial-gradient(circle at 50% 35%, #12493f 0, #082b25 42%, #061d19 100%); overscroll-behavior-x: none; }
      main { width: min(440px, calc(100vw - 48px)); text-align: center; }
      .mark { display: block; width: 88px; height: 88px; margin: 0 auto 24px; overflow: hidden; border-radius: 24px; box-shadow: 0 24px 70px rgba(0, 0, 0, .3); }
      .mark img { display: block; width: 100%; height: 100%; }
      h1 { margin: 0; font-size: 30px; letter-spacing: -.03em; }
      p { margin: 12px 0 0; color: #a9c7bd; line-height: 1.55; }
      .loader { width: 100%; height: 4px; margin-top: 32px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, .1); }
      .loader::after { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: #1fe0c0; animation: load 1.15s ease-in-out infinite alternate; }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><img src="favicon.svg" alt="" /></div>
      <h1>JAVA_linguo</h1>
      <p id="status">Preparazione dell’ambiente di studio locale…</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
