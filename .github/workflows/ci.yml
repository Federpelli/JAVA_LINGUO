name: Qualità e sicurezza

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Test, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configura Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Configura Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Installa dipendenze bloccate dal lockfile
        run: npm ci --ignore-scripts

      - name: Controlla vulnerabilità npm
        run: npm audit --audit-level=high

      - name: Controlla il frontend
        run: npx oxlint app

      - name: Verifica gestione errori updater
        run: npm run test:update-errors

      - name: Genera la build distribuibile
        run: npm run build

      - name: Esegue i test Python
        run: python -m unittest discover -s tests -v

      - name: Verifica gli script di avvio
        run: python -m py_compile avvia.py collega_github.py scripts/build_sidecar.py scripts/collect_desktop_artifacts.py

  desktop-native-check:
    name: Verifica shell desktop Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Scarica il repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installa librerie desktop Linux
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev

      - name: Configura Rust stabile
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Prepara il segnaposto del sidecar
        run: touch src-tauri/binaries/java-linguo-backend-x86_64-unknown-linux-gnu

      - name: Controlla il codice nativo
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
