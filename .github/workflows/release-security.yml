name: Integrità release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest-release:
    name: Release, SBOM, checksum e attestazione
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il tag pubblicato
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verifica che tag e VERSION coincidano
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Crea la release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "JAVA_linguo $GITHUB_REF_NAME" \
              --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi

      - name: Configura Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Installa dipendenze bloccate dal lockfile
        run: npm ci --ignore-scripts

      - name: Genera archivio, SBOM e checksum
        shell: bash
        run: |
          archive="JAVA_linguo-${GITHUB_REF_NAME}-source.zip"
          git archive --format=zip --output="$archive" HEAD
          npm sbom --sbom-format=cyclonedx > JAVA_linguo-sbom.cdx.json
          sha256sum "$archive" JAVA_linguo-sbom.cdx.json > SOURCE-SHA256SUMS.txt

      - name: Attesta la provenienza dell'archivio
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: JAVA_linguo-${{ github.ref_name }}-source.zip

      - name: Pubblica gli artefatti verificabili
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "JAVA_linguo-${GITHUB_REF_NAME}-source.zip"
          JAVA_linguo-sbom.cdx.json
          SOURCE-SHA256SUMS.txt
          --clobber
